name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B -ntp package

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flight SQL test clients
        run: pip install adbc-driver-flightsql adbc-driver-manager pyarrow pytest

      - name: Flight SQL integration tests
        run: bash integration-tests/flight-sql/run.sh

      - name: Server logs
        if: failure()
        run: |
          for f in /tmp/tmp.*/opencanard/logs/*; do echo "===== $f"; tail -300 "$f"; done
