name: Release

# Push a tag vX.Y.Z (matching <version> in pom.xml) to build, test and publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
# Publishes a GitHub release with the server zip, the JDBC driver, the DBeaver plugin and their checksums,
# and the Docker image ghcr.io/<owner>/opencanard:<version> (and :latest for non-prerelease versions).
# Run it by hand (workflow_dispatch) for a dry run: everything is built and tested, nothing is published.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check that the tag matches the project version
        run: |
          VERSION="$(mvn -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "Dry run for $VERSION (not a tag): nothing will be published"
            echo "DRY_RUN=1" >> "$GITHUB_ENV"
          elif [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version in pom.xml ($VERSION)" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          case "$VERSION" in *-*) echo "PRERELEASE=1" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=0" >> "$GITHUB_ENV" ;; esac

      - name: Build
        run: mvn -B -ntp package

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test clients
        run: |
          pip install adbc-driver-flightsql adbc-driver-manager pyarrow pytest
          command -v nginx || { sudo apt-get update -q && sudo apt-get install -y -q nginx; }

      - name: Integration tests
        env:
          OC_REQUIRE_TLS_TEST: '1'
        run: bash integration-tests/flight-sql/run.sh

      - name: DBeaver plugin
        run: bash opencanard-dbeaver-connector/build.sh

      - name: Collect release files
        run: |
          mkdir dist
          cp opencanard-server/target/opencanard.zip "dist/opencanard-$VERSION.zip"
          cp "opencanard-jdbc-driver/target/opencanard-jdbc-driver-$VERSION-all.jar" dist/
          cp opencanard-dbeaver-connector/target/org.opencanard.dbeaver.connector_*.jar dist/
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
          # release notes: the section of CHANGELOG.md for this version
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found && !/^\[/ { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi

      - name: Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opencanard"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE:$VERSION" .
          if [ "${DRY_RUN:-0}" = 1 ]; then
            echo "Dry run: $IMAGE:$VERSION built, not pushed"
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          if [ "$PRERELEASE" = 0 ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

      - name: Keep the release files (dry run)
        if: env.DRY_RUN == '1'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            dist/
            notes.md

      - name: GitHub release
        if: env.DRY_RUN != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\n### Docker\n\n```\ndocker pull %s:%s\n```\n' "$IMAGE" "$VERSION" >> notes.md
          FLAGS=()
          [ "$PRERELEASE" = 1 ] && FLAGS+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --title "OpenCanard $VERSION" --notes-file notes.md "${FLAGS[@]}"
