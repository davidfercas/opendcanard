# =============================
# OpenCanard Server Configuration
# =============================


# Server network settings
# Interface both ports bind to. Use 127.0.0.1 when a reverse proxy on the same host provides TLS
# (OpenCanard itself speaks plain gRPC and HTTP, see docs/authentication.md#tls).
opencanard.host=0.0.0.0
opencanard.port=8815

opencanard.db=opencanard.duckdb
metadatadb.db=metadata.duckdb

# Max memory for Arrow buffers in MB
arrow.memory.mb=512

# Logging is configured in conf/log4j2.xml

# REST API
opencanard.rest.port=8084
# Interface of the REST API, when it must differ from opencanard.host
#opencanard.rest.host=127.0.0.1

# JWT tokens of the REST login (also accepted on the Flight port)
# Signing key, at least 32 bytes. When not set (and OPENCANARD_JWT_SECRET is not set either), a random key is
# created in metadata/jwt.key on the first start.
#jwt.secret=
# Lifetime of a token, in minutes
jwt.expiry.minutes=60

# Web console: how many past queries the History list keeps per user (0 turns it off, at most 100)
console.history.size=10
