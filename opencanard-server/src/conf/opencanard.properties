# =============================
# OpenCanard Server Configuration
# =============================


# Server network settings
opencanard.host=0.0.0.0
opencanard.port=8815

opencanard.db=opencanard.duckdb
metadatadb.db=metadata.duckdb

# Max memory for Arrow buffers in MB
arrow.memory.mb=512


# TLS / SSL settings
tls.enabled=true
tls.certFile=certs/server-cert.pem
tls.keyFile=certs/server-key.pem

# Arrow Flight memory allocator (in MB)
arrow.memory.mb=512

# Logging (optional)
log.level=INFO
log.file=logs/opencanard.log

# REST API
opencanard.rest.port=8084
